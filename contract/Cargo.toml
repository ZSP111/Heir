[package]
name = "heir-vault"
description = "Heir: a dead man's switch inheritance vault on NEAR"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/ZSP111/Heir"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
